[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "One window onto your computers: think with a pen on a canvas, sling anything to an agent, and get things back instead of chat."
repository = "https://github.com/jayminwest/slinger"
[workspace.dependencies]
slinger-core = { path = "crates/core", version = "0.0.0" }
slinger-control = { path = "crates/control", version = "0.0.0" }
slingerd = { path = "crates/daemon", version = "0.0.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
gethostname = "1"
miniz_oxide = "0.9"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "NSAffineTransform", "NSApplication", "NSAttributedString", "NSBezierPath", "NSBox", "NSColor", "NSControl", "NSCursor", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSImage", "NSLayoutManager", "NSOpenPanel", "NSPanel", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSText", "NSTextContainer", "NSTextField", "NSTextStorage", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAffineTransform", "NSArray", "NSAttributedString", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSProcessInfo", "NSRunLoop", "NSString", "NSTimer", "NSURL", "NSURLRequest", "NSURLResponse", "NSUserDefaults", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentRuleList", "WKContentRuleListStore", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKPreferences", "WKScriptMessage", "WKScriptMessageHandlerWithReply", "WKUIDelegate", "WKURLSchemeHandler", "WKURLSchemeTask", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWindowFeatures"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction lints on top of pedantic. Make exceptions with
# #[expect(lint, reason = "...")], never a bare allow.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# The app is a thin front end with a binary-size budget (check:binary-size);
# speed does not matter in it. `strip` is repeated because a package
# override does not keep the profile's.
[profile.release.package.slinger-app]
opt-level = "z"
strip = true
