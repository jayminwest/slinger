[package]
name = "slinger-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The slinger macOS app."
repository.workspace = true
# A macOS app ships as a bundle (scripts/bundle.sh), not as a crate.
publish = false

[[bin]]
name = "slinger-app"
path = "src/main.rs"

[dependencies]
slinger-control.workspace = true
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSCell", "NSMenu", "NSMenuItem", "NSPasteboard", "NSWorkspace"] }
objc2-foundation.workspace = true
objc2-web-kit.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests run the app's backend against a real daemon on a real socket.
slingerd.workspace = true
tempfile.workspace = true
[lints]
workspace = true
