name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-all:
    # The app links AppKit, so the gates run on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny,cargo-llvm-cov
      # The only run step: check:ci-parity fails on any other.
      - run: cargo xtask check-all
