# slinger: every app config option, with its default.
#
# The app reads $SLINGER_CONFIG, else $XDG_CONFIG_HOME/slinger/config.toml, else
# ~/.config/slinger/config.toml. A missing file means every default. Keep this file the
# same on every machine.
#
# Machine overlay: config.local.toml next to config.toml (for a file named <name>.toml,
# <name>.local.toml) is merged over it, key by key. Put values that differ by machine
# there, and keep it out of whatever syncs config.toml.
#
# Edit either file in place: the running app reloads it within a second. A file with an
# error keeps the last good config, and the window shows the file, the line and the error.
#
# Lines that start with "#" and a letter are settings: delete the "#" to use one. Lines
# that start with "# " are notes. Every value is a double-quoted string; \" and \\ are the
# only escapes. A test checks that this file lists every key the app reads.

# --- theme: the one theme. Colours are "#rrggbb".
[theme]
# The window's background.
#background = "#1e1e1e"
# Text.
#text = "#e6e6e6"
# Secondary text, such as hints.
#muted = "#8c8c8c"
# Errors.
#error = "#ff6b6b"
# The focus border around the focused pane: the one line the window draws.
#focus = "#4c9aff"

# --- daemon: how the app reaches slingerd.
[daemon]
# The control socket; a leading "~/" is the home folder. Unset by default: the daemon's
# own default ($XDG_RUNTIME_DIR/slinger.sock, else in the temp folder). Example:
#socket = "~/.local/state/slinger/slinger.sock"

# --- workspace: what the window shows.
[workspace]
# The workspace whose panes the window shows, by name. The server keeps its panes, so a
# pane opened or closed anywhere shows here. Unset by default: the first open workspace,
# by name. Example:
#name = "notes"

# --- pen: the canvas pen.
[pen]
# The colours the colour pop-up offers, in order: one to nine "#rrggbb", split by spaces or
# commas. The digit keys 1 to 9 pick them. The first is the pen's colour at start.
#colours = "#e6e6e6 #ff6b6b #ffa94d #ffd43b #69db7c #4dabf7 #b197fc"

# --- window: the window around the panes.
[window]
# The sidebar, which lists the open workspaces and each agent's status (working, blocked,
# done): "open" or "closed" when the app starts. The toggle-sidebar command opens or
# collapses it at any time.
#sidebar = "open"

# --- keys: every action is a named command, bound to a key chord here.
# A chord is lowercase modifiers (shift, ctrl, alt, cmd) joined by "+", then one character
# or a key's name: space, tab, return, escape, delete, forward-delete, up, down, left,
# right, f1 to f20. "cmd++" is the plus key. A letter matches in either case; with shift,
# write the letter ("cmd+shift+k"). "" binds a command to no key. Two commands on one
# chord in one file is an error. A chord set in a file moves from the command that had it
# by default, or in the shared file when set in the overlay; that command has no key then.
# A tablet button is a key: bind it to a chord in the tablet's own software. show-keys
# lists every command with its key; show-commands finds one by name. The final keys are
# not decided yet.
[keys]
# Quit the app.
#quit = "cmd+q"
# Read the config files again now, without waiting for the change to be noticed.
#reload-config = "cmd+r"
# Pop-ups at the pen: each opens a small pop-up where the pen or pointer last was. Pick
# with the pen, with a digit (1 to 9), or with the arrow keys and return; escape, or the
# same command again, closes it.
# The pen's colour, from [pen] colours.
#pick-colour = "cmd+shift+c"
# A shape to draw: box or arrow.
#pick-shape = "cmd+shift+s"
# A tool: pen, eraser, lasso or text.
#pick-tool = "cmd+shift+t"
# Split the focused pane in two, side by side; the new pane, on the right, shows the same.
#split-right = "cmd+d"
# Split the focused pane in two, one over the other; the new pane, below, shows the same.
#split-down = "cmd+shift+d"
# Close the focused pane; the pane beside it takes its space. The last pane stays.
#close-pane = "cmd+w"
# Focus the next pane: left to right, top to bottom, then back to the first.
#focus-next = "ctrl+tab"
# Focus the pane beside the focused one.
#focus-left = "cmd+alt+left"
#focus-right = "cmd+alt+right"
#focus-up = "cmd+alt+up"
#focus-down = "cmd+alt+down"
# Give the focused pane more, or less, of the space it shares with the pane beside it.
#grow-pane = "cmd+="
#shrink-pane = "cmd+-"
# Open the sidebar, or collapse it; the panes take the space it leaves.
#toggle-sidebar = "cmd+b"
# Hide the notice that an agent became blocked or done. It also goes once the agent's
# status moves on.
#dismiss-notice = "cmd+."
# Move the focused pane's canvas a step: the view goes that way. The trackpad pans too.
#pan-left = "alt+left"
#pan-right = "alt+right"
#pan-up = "alt+up"
#pan-down = "alt+down"
# Zoom the focused pane's canvas in or out about its centre. The trackpad pinches too.
#zoom-in = "alt+="
#zoom-out = "alt+-"
# Pages: each pane shows its own page of its canvas, named at its foot. Turn the
# focused pane to the next page (after the last, the first) or the one before.
#next-page = "cmd+]"
# Remove the items the lasso selected, in one undo step. With nothing selected on the
# focused pane's canvas the key goes on as usual.
#delete-selection = "delete"
# Select nothing. With nothing selected on the focused pane's canvas the key goes on.
#clear-selection = "escape"
# Pick a tool without a pop-up. While a text is being typed, keys without cmd or ctrl
# type into it (escape ends it), so these keep a modifier.
#tool-pen = "cmd+1"
#tool-eraser = "cmd+2"
#tool-lasso = "cmd+3"
#tool-text = "cmd+4"
#tool-box = "cmd+5"
#tool-arrow = "cmd+6"
# Sling the selection to the agent of the canvas's workspace: a one-line prompt opens at
# the selection. Return sends (an empty prompt too), escape cancels; while it is open it
# takes every other key. With nothing selected on the focused pane's canvas the key goes on.
#sling = "cmd+return"
# Turn the focused pane to the page before; before the first, the last.
#previous-page = "cmd+["
# Add a page after the last; the focused pane turns to it.
#new-page = "cmd+n"
# Type a new name for the focused pane's page: return keeps it, escape keeps the old one.
#rename-page = "cmd+shift+r"
# Remove the focused pane's page and its items. A page with items asks first: the same
# command again, or return, removes it; escape keeps it. The last page stays.
#remove-page = "cmd+shift+delete"
# Undo the last thing you did on the focused pane's canvas (a stroke, an erase, a move,
# a text, a page), or redo what you undid. An agent's items are its own: your undo never
# takes them back.
#undo = "cmd+z"
#redo = "cmd+shift+z"
# Speak the sling's prompt through Flick's dictation (Flick must be running, with
# [dictation] set up): opens the prompt at the selection if it is closed, and Flick starts
# listening; press again to stop, and Flick types what it heard into the prompt. Escape or
# return cancels a dictation still going. Slinger has no speech code of its own.
#dictate = "cmd+shift+return"
# Put a "send to agent" button in the middle of the focused pane's canvas page. A tap on
# it slings what is new on the page since the last sling, with no prompt; its mark is the
# status of the agent of the canvas's workspace. With nothing selected, `sling` opens the
# prompt beside it, and a tap sends that prompt. Select, move and delete it like a box.
#place-button = "cmd+shift+b"
# Show every command, by group, with its key (the key overlay).
#show-keys = "cmd+/"
# Find a command by its name and run it (the command palette).
#show-commands = "cmd+k"
# Leave a note about slinger itself, without leaving it: a one-line entry opens in the
# focused pane; return saves it, with what the window shows, to slingerd's feedback file
# (`slinger feedback path`), and escape cancels.
#leave-feedback = "cmd+shift+f"
