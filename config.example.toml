# slinger: every app config option, with its default.
#
# The app reads $SLINGER_CONFIG, else $XDG_CONFIG_HOME/slinger/config.toml, else
# ~/.config/slinger/config.toml. A missing file means every default. Keep this file the
# same on every machine.
#
# Machine overlay: config.local.toml next to config.toml (for a file named <name>.toml,
# <name>.local.toml) is merged over it, key by key. Put values that differ by machine
# there, and keep it out of whatever syncs config.toml.
#
# Edit either file in place: the running app reloads it within a second. A file with an
# error keeps the last good config, and the window shows the file, the line and the error.
#
# Lines that start with "#" and a letter are settings: delete the "#" to use one. Lines
# that start with "# " are notes. Every value is a double-quoted string; \" and \\ are the
# only escapes. A test checks that this file lists every key the app reads.

# --- theme: the one theme. Colours are "#rrggbb".
[theme]
# The window's background.
#background = "#1e1e1e"
# Text.
#text = "#e6e6e6"
# Secondary text, such as hints.
#muted = "#8c8c8c"
# Errors.
#error = "#ff6b6b"
# The accent: the border around the focused pane (drawn only with two or more panes), the
# text caret, the selection, the sling field's edge and a working agent's mark.
#focus = "#4c9aff"
# A done agent's mark in the sidebar.
#done = "#4cc36b"

# --- daemon: how the app reaches slingerd.
[daemon]
# The control socket; a leading "~/" is the home folder. Unset by default: the daemon's
# own default ($XDG_RUNTIME_DIR/slinger.sock, else in the temp folder). Example:
#socket = "~/.local/state/slinger/slinger.sock"

# --- workspace: what the window shows.
[workspace]
# The workspace whose panes the window shows, by name. The server keeps its panes, so a
# pane opened or closed anywhere shows here. Unset by default: the first open workspace,
# by name. Example:
#name = "notes"

# --- pen: the canvas pen.
[pen]
# The colours the colour pop-up offers, in order: one to nine "#rrggbb", split by spaces or
# commas. The digit keys 1 to 9 pick them. The first is the pen's colour at start.
#colours = "#e6e6e6 #ff6b6b #ffa94d #ffd43b #69db7c #4dabf7 #b197fc"
# The line widths the width pop-up offers, in order: one to nine widths in canvas points,
# from 0.1 to 50 with at most one decimal place, split by spaces or commas. The digit keys
# 1 to 9 pick them. The first is the pen's width at start. A width is the pen's alone:
# boxes and arrows keep their one line width.
#widths = "2 4 8 16"

# --- window: the window around the panes.
[window]
# The sidebar, which lists the open workspaces and each agent's status (working, blocked,
# done): "open" or "closed" when the app starts. Unset, it starts as you last left it
# (open the first time). The toggle-sidebar command opens or collapses it at any time.
#sidebar = "open"

# --- canvas: the paper under the ink.
[canvas]
# What the canvas panes show under the items when the app starts: "plain", or "dots" for a
# dotted grid. The toggle-grid command shows or hides the dots at any time; it is not saved,
# so the next start, or an edit of this key, goes back to this value. The dots are fixed
# to the canvas (they pan and zoom with the ink) and are for you only: they are not items,
# and an agent never sees them. Zoomed far out, every 2nd, 5th or 10th dot shows.
#background = "plain"
# The canvas points between two dots, from 1 to 500 with at most two decimal places. The
# default, 28.35, is 1 cm at 100% zoom on a screen that shows 72 points per inch. Most Mac
# screens show more (about 110 to 130), so there the dots are closer than 1 cm; for 1 cm
# on the glass, write your screen's points per inch divided by 2.54 (120 gives "47.24").
#grid = "28.35"

# --- sling: what goes to the agent with a sling.
[sling]
# The words sent with a sling you wrote no prompt for: a tap on "➤ Sling" (at the
# selection, in a pane's footer, or the sling-now key), a "send to agent" button, and the
# entry sent empty. Your handwriting is the question; these words tell the agent to read
# it. The agent is already told to answer on the canvas. Must not be blank.
#prompt = "Read what I wrote and do what it asks."

# --- keys: every action is a named command, bound to a key chord here.
# A chord is lowercase modifiers (shift, ctrl, alt, cmd) joined by "+", then one character
# or a key's name: space, tab, return, escape, delete, forward-delete, up, down, left,
# right, f1 to f20. "cmd++" is the plus key. A letter matches in either case; with shift,
# write the letter ("cmd+shift+k"). "" binds a command to no key. Two commands on one
# chord in one file is an error. A chord set in a file moves from the command that had it
# by default, or in the shared file when set in the overlay; that command has no key then.
# A tablet button is a key: bind it to a chord in the tablet's own software. show-keys
# lists every command with its key; show-commands finds one by name. The final keys are
# not decided yet.
[keys]
# Quit the app.
#quit = "cmd+q"
# Read the config files again now, without waiting for the change to be noticed.
#reload-config = "cmd+r"
# Pop-ups at the pen: each opens a small pop-up where the pen or pointer last was. Pick
# with the pen, with a digit (1 to 9), or with the arrow keys and return; escape, or the
# same command again, closes it.
# The pen's colour, from [pen] colours.
#pick-colour = "cmd+shift+c"
# A shape to draw: box or arrow.
#pick-shape = "cmd+shift+s"
# A tool: pen, eraser, lasso, text or select.
#pick-tool = "cmd+shift+t"
# The pen's line width, from [pen] widths: each shown as a line of that width in the pen's
# colour.
#pick-width = "cmd+shift+w"
# Split the focused pane in two, side by side; the new pane, on the right, shows the same.
#split-right = "cmd+d"
# Split the focused pane in two, one over the other; the new pane, below, shows the same.
#split-down = "cmd+shift+d"
# Close the focused pane; the pane beside it takes its space. The last pane stays.
#close-pane = "cmd+w"
# Focus the next pane: left to right, top to bottom, then back to the first.
#focus-next = "ctrl+tab"
# Focus the pane beside the focused one.
#focus-left = "cmd+alt+left"
#focus-right = "cmd+alt+right"
#focus-up = "cmd+alt+up"
#focus-down = "cmd+alt+down"
# Give the focused pane more, or less, of the space it shares with the pane beside it.
#grow-pane = "alt+="
#shrink-pane = "alt+-"
# Open the sidebar, or collapse it; the panes take the space it leaves.
#toggle-sidebar = "cmd+b"
# Hide the notice that an agent became blocked or done. It also goes once the agent's
# status moves on.
#dismiss-notice = "cmd+."
# Move the focused pane's canvas a step: the view goes that way. The trackpad pans too.
#pan-left = "alt+left"
#pan-right = "alt+right"
#pan-up = "alt+up"
#pan-down = "alt+down"
# Zoom the focused pane's canvas in or out about its centre, or back to 100%. Each zoom
# flashes its level. The trackpad pinches too, and a scroll (wheel or two fingers) with
# cmd or ctrl held zooms about the pointer: away from you zooms in.
#zoom-in = "cmd+="
#zoom-out = "cmd+-"
#zoom-reset = "cmd+0"
# Pages: each pane shows its own page of its canvas, named at its foot. Turn the
# focused pane to the next page (after the last, the first) or the one before.
#next-page = "cmd+]"
# Remove the selected items (the lasso's or the select tool's), in one undo step. With
# nothing selected on the focused pane's canvas the key goes on as usual.
#delete-selection = "delete"
# Select nothing. With nothing selected on the focused pane's canvas the key goes on.
#clear-selection = "escape"
# Pick a tool without a pop-up. While a text is being typed, keys without cmd or ctrl
# type into it (escape ends it), so these keep a modifier.
#tool-pen = "cmd+1"
#tool-eraser = "cmd+2"
#tool-lasso = "cmd+3"
#tool-text = "cmd+4"
#tool-box = "cmd+5"
#tool-arrow = "cmd+6"
#tool-select = "cmd+7"
# Crop a PDF: drag a box on a page; that part of the page goes on the clipboard as a
# snippet, and the canvas does not change. Paste it on any canvas, then move and resize it
# like any item.
#crop-pdf = "cmd+8"
# The next width of [pen] widths for the pen, or the one before; at either end it stays.
#width-up = "alt+]"
#width-down = "alt+["
# Sling the selection to the agent of the canvas's workspace with words of your own: a
# one-line prompt opens at the selection (the "+ prompt" button beside a selection opens it
# too). Return sends; sent empty, it sends [sling] prompt. Escape cancels; while it is open
# it takes every other key. With nothing selected on the focused pane's canvas the key goes
# on.
#sling = "cmd+return"
# Sling at once, with [sling] prompt as its words: the selection (the ink is the
# question), or with nothing selected what is new on the focused pane's page since the last
# sling. While the prompt is open it sends the prompt. The "➤ Sling" button beside a
# selection and the one in each canvas pane's footer run it. With no agent in the canvas's
# workspace it says so and sends nothing. A pill under the selection then says what the
# agent is doing, and when it answered; a tap on it shows the answer.
#sling-now = "alt+return"
# Turn the focused pane to the page before; before the first, the last.
#previous-page = "cmd+["
# Add a page after the last; the focused pane turns to it.
#new-page = "cmd+n"
# Type a new name for the focused pane's page: return keeps it, escape keeps the old one.
#rename-page = "cmd+shift+r"
# Remove the focused pane's page and its items. A page with items asks first: the same
# command again, or return, removes it; escape keeps it. The last page stays.
#remove-page = "cmd+shift+delete"
# Undo the last thing you did on the focused pane's canvas (a stroke, an erase, a move,
# a text, a page), or redo what you undid. An agent's items are its own: your undo never
# takes them back.
#undo = "cmd+z"
#redo = "cmd+shift+z"
# Speak the sling's prompt through Flick's dictation (Flick must be running, with
# [dictation] set up): opens the prompt at the selection if it is closed, and Flick starts
# listening; press again to stop, and Flick types what it heard into the prompt. Escape or
# return cancels a dictation still going. Slinger has no speech code of its own.
#dictate = "cmd+shift+return"
# Put a "send to agent" button in the middle of the focused pane's canvas page. A tap on
# it slings what is new on the page since the last sling, with [sling] prompt; its mark is the
# status of the agent of the canvas's workspace. With nothing selected, `sling` opens the
# prompt beside it, and a tap sends that prompt. Select, move and delete it like a box.
#place-button = "cmd+shift+b"
# Show every command, by group, with its key (the key overlay).
#show-keys = "cmd+/"
# Find a command by its name and run it (the command palette).
#show-commands = "cmd+k"
# Leave a note about slinger itself, without leaving it: a one-line entry opens in the
# focused pane; return saves it, with what the window shows, to slingerd's feedback file
# (`slinger feedback path`), and escape cancels.
#leave-feedback = "cmd+shift+f"
# Show the dotted grid on every canvas pane, or hide it ([canvas] background is the start).
# It flashes "Dotted grid on" or "Dotted grid off".
#toggle-grid = "cmd+'"
# Say where the focused pane's canvas is saved. slingerd writes every change to the
# canvas's file as you make it, so there is nothing to save by hand: this flashes the file
# ("Saved to ~/…/main.canvas"), or why the last change has not reached it. The window's
# title names the focused pane's canvas, with its file under it; cmd-click the title for
# the folders that hold it.
#save = "cmd+s"
# Show the focused pane's canvas file in the Finder.
#show-canvas-file = "cmd+alt+r"
# Open a PDF as a new canvas, its pages one under the next, in a pane beside the focused
# one. Write on it with any tool.
#open-pdf = "cmd+o"
# Open a folder as a workspace (the panel can make a new folder) and show it in the
# window. The "+" at the foot of the open sidebar does the same.
#open-workspace = "cmd+shift+o"
# Close the workspace the window shows and show the first left. Its file, its canvas and
# its agent stay; open its folder again to bring it back. A workspace whose file is broken
# shows "Close workspace" under why in the sidebar while the window shows it.
#close-workspace = "cmd+alt+w"
# Start the agent of the workspace the window shows, with its own limits, in its last
# conversation (one that runs stays as it is); a flash names it, or says why not. While its
# agent is not running, the sidebar shows "Start agent" under it: a tap does the same.
#start-agent = "cmd+alt+a"
# Stop the agent of the workspace the window shows: its process ends, and its conversation
# stays for the next start-agent.
#stop-agent = "cmd+alt+."
